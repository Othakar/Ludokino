name: .NET API

on:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      LUDOKINO_TEST_CONNECTION_STRING: Host=localhost;Database=ludokino_test;Username=postgres;Password=postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ludokino_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ludokino_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ludokino-web/package-lock.json

      - name: Restaurer les dépendances
        run: dotnet restore Ludokino.sln

      - name: Installer les dépendances frontend
        run: npm --prefix ludokino-web ci

      - name: Compiler la solution
        run: dotnet build Ludokino.sln --configuration Release --no-restore

      - name: Exécuter les tests
        run: dotnet test Ludokino.sln --configuration Release --no-build --verbosity normal

      - name: Vérifier le lint frontend
        run: npm --prefix ludokino-web run lint

      - name: Compiler le frontend
        run: npm --prefix ludokino-web run build
